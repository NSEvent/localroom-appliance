name: LocalRoom
options:
  bundleIdPrefix: xyz.kevintang
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 542GXYT5Z2
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
targets:
  LocalRoom:
    type: application
    platform: iOS
    sources:
      - LocalRoom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.kevintang.localroom
        PRODUCT_NAME: LocalRoom
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: LocalRoom
        INFOPLIST_KEY_NSCameraUsageDescription: LocalRoom uses the camera so other meeting participants can see you.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: LocalRoom uses the microphone for the call and private local transcription on your Dell Pro.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: LocalRoom connects to your Dell Pro on the local network for meetings and transcription.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: []
